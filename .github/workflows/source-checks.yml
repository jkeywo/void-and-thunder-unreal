name: Source and project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source, attribution and native asset pointers
        shell: pwsh
        run: ./Scripts/SourceChecks.ps1
      - name: Native validation policy
        shell: pwsh
        run: Write-Output 'This workflow checks source metadata, script syntax, independent legacy fixtures and LFS pointers. Unreal compilation, gameplay, multiplayer, soak and packaging gates run through Scripts/ on a licensed engine installation.'
